# render.yaml — Render.com deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: capitalcode
    runtime: node
    region: frankfurt          # closest to Czech Republic / EU
    plan: free                 # change to "starter" or "standard" for prod
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ─── Node ─────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0

      # ─── App URL ──────────────────────────────────────────────
      # Set this to your actual Render URL or custom domain
      - key: NEXT_PUBLIC_APP_URL
        value: https://capitalcode.onrender.com

      # ─── TursoDB ──────────────────────────────────────────────
      # Paste values from https://turso.tech/app
      - key: TURSO_DATABASE_URL
        sync: false            # entered manually in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false

      # ─── Auth ─────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a secure random value

      # ─── Admin ────────────────────────────────────────────────
      - key: ADMIN_KEY
        generateValue: true

      # ─── Resend (email) ───────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # ─── Stripe ───────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ─── Stripe Price IDs ─────────────────────────────────────
      - key: STRIPE_PRICE_BOOK
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
      - key: STRIPE_PRICE_DISCORD
        sync: false
      - key: STRIPE_PRICE_DIGITAL
        sync: false
      - key: STRIPE_PRICE_PHYSICAL
        sync: false
      - key: STRIPE_PRICE_BUNDLE
        sync: false
